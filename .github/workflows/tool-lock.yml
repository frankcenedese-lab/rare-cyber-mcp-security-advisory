name: Verify tool definitions and agent duties (TC-06, TC-11)

on:
  push:
    paths: ["lab/tools/**", "lab/identity/**", "lab/tool_lock.py", "lab/sod_check.py"]
  pull_request:
    paths: ["lab/tools/**", "lab/identity/**", "lab/tool_lock.py", "lab/sod_check.py"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python lab/tool_lock.py verify
      - run: python lab/sod_check.py
