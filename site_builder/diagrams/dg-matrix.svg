<svg class="dg" viewBox="0 0 1040 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Control equivalence between the AWS hardened stack and the Azure reference design">
<defs>
  <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#94a3b8"/></marker>
</defs>
<rect class="panel" x="10" y="10" width="1020" height="450" rx="14"/>
<rect x="40" y="30" width="330" height="36" rx="8" fill="#d97706" opacity=".12"/><rect x="40" y="30" width="4" height="36" fill="#d97706"/>
<text class="hd" x="56" y="53">AWS HARDENED STACK (TESTED)</text>
<rect x="670" y="30" width="330" height="36" rx="8" fill="#2563eb" opacity=".12"/><rect x="670" y="30" width="4" height="36" fill="#2563eb"/>
<text class="hd" x="686" y="53">AZURE REFERENCE DESIGN</text>
<text class="zl" x="520" y="53" text-anchor="middle">CONTROL OBJECTIVE</text>

