  <path class="fl grey" d="M372 30 H434" marker-end="url(#mk)"/><path class="fl grey" d="M606 30 H668" marker-end="url(#mk)"/>
  <rect class="obj" x="438" y="12" width="164" height="36" rx="18"/><text class="t3 c" x="520" y="34" text-anchor="middle">Endpoint authentication</text>
  <rect class="box" x="670" y="0" width="330" height="60" rx="9"/><text class="t1" x="688" y="27">Azure API Management</text><text class="t2" x="688" y="45">MCP server governance · validate-azure-ad-token</text>
</g>
<g class="row" transform="translate(0,158)">
  <rect class="box" x="40" y="0" width="330" height="60" rx="9"/><text class="t1" x="58" y="27">IAM execution role per tool</text><text class="t2" x="58" y="45">Least-privilege policy per function</text>
  <path class="fl grey" d="M372 30 H434" marker-end="url(#mk)"/><path class="fl grey" d="M606 30 H668" marker-end="url(#mk)"/>
  <rect class="obj" x="438" y="12" width="164" height="36" rx="18"/><text class="t3 c" x="520" y="34" text-anchor="middle">Least privilege</text>
  <rect class="box" x="670" y="0" width="330" height="60" rx="9"/><text class="t1" x="688" y="27">Managed identity per tool + app roles</text><text class="t2" x="688" y="45">Tool credential and caller authorization</text>
</g>
<g class="row" transform="translate(0,232)">
  <rect class="box" x="40" y="0" width="330" height="60" rx="9"/><text class="t1" x="58" y="27">Bedrock Guardrails</text><text class="t2" x="58" y="45">Prompt attack filtering</text>
  <path class="fl grey" d="M372 30 H434" marker-end="url(#mk)"/><path class="fl grey" d="M606 30 H668" marker-end="url(#mk)"/>
  <rect class="obj" x="438" y="12" width="164" height="36" rx="18"/><text class="t3 c" x="520" y="34" text-anchor="middle">Prompt injection defence</text>
  <rect class="box" x="670" y="0" width="330" height="60" rx="9"/><text class="t1" x="688" y="27">Azure AI Content Safety</text><text class="t2" x="688" y="45">Prompt Shields · direct and indirect attacks</text>
</g>
<g class="row" transform="translate(0,306)">
  <rect class="box" x="40" y="0" width="330" height="60" rx="9"/><text class="t1" x="58" y="27">AWS WAF · Amazon Macie</text><text class="t2" x="58" y="45">Request filtering · sensitive data discovery</text>
  <path class="fl grey" d="M372 30 H434" marker-end="url(#mk)"/><path class="fl grey" d="M606 30 H668" marker-end="url(#mk)"/>
  <rect class="obj" x="438" y="12" width="164" height="36" rx="18"/><text class="t3 c" x="520" y="34" text-anchor="middle">Egress &amp; data protection</text>
  <rect class="box" x="670" y="0" width="330" height="60" rx="9"/><text class="t1" x="688" y="27">Azure WAF · Microsoft Purview</text><text class="t2" x="688" y="45">Request filtering · sensitive data discovery</text>
</g>
<g class="row" transform="translate(0,380)">
