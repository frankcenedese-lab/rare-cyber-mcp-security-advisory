<svg class="dg" viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Identity flow: a new audience-bound token at each hop, with no token passthrough">
<defs>
  <marker id="fk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
  <marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#059669"/></marker>
  <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#dc2626"/></marker>
</defs>
<rect class="panel" x="10" y="10" width="1020" height="540" rx="14"/>
<text class="hd" x="30" y="40">A NEW, AUDIENCE-BOUND TOKEN AT EVERY HOP</text>

<!-- identity provider -->
<rect class="box good" x="190" y="62" width="650" height="52" rx="9"/>
<text class="t1" x="515" y="86" text-anchor="middle">Identity provider</text>
<text class="t2" x="515" y="103" text-anchor="middle">IAM / STS · Entra ID with Agent ID · issues and exchanges tokens</text>

<!-- main row -->
<rect class="box" x="30" y="190" width="130" height="64" rx="9"/>
<text class="t1" x="95" y="218" text-anchor="middle">User</text><text class="t2" x="95" y="236" text-anchor="middle">alice</text>

<rect class="box" x="230" y="190" width="150" height="64" rx="9"/>
<text class="t1" x="305" y="218" text-anchor="middle">AI Agent</text><text class="t2" x="305" y="236" text-anchor="middle">agent-finance-01</text>

<rect class="box good" x="450" y="190" width="150" height="64" rx="9"/>
<text class="t1" x="525" y="214" text-anchor="middle">API Gateway</text><text class="t2" x="525" y="231" text-anchor="middle">checks aud, sub, act,</text><text class="t2" x="525" y="245" text-anchor="middle">roles and amount</text>

<rect class="box" x="670" y="190" width="150" height="64" rx="9"/>
<text class="t1" x="745" y="218" text-anchor="middle">MCP server</text><text class="t2" x="745" y="236" text-anchor="middle">mcp-finance</text>

<rect class="box" x="890" y="190" width="120" height="64" rx="9"/>
<text class="t1" x="950" y="218" text-anchor="middle">ERP API</text><text class="t2" x="950" y="236" text-anchor="middle">system of record</text>

<!-- flows -->
<path class="fl kk" d="M160 222 H226" marker-end="url(#fk)"/>
<path class="fl kk" d="M290 186 V118" marker-end="url(#fk)"/>
<path class="fl green" d="M320 118 V186" marker-end="url(#fg)"/>
<path class="fl green" d="M380 222 H446" marker-end="url(#fg)"/>
<path class="fl kk" d="M600 222 H666" marker-end="url(#fk)"/>
<path class="fl kk" d="M730 186 V118" marker-end="url(#fk)"/>
<path class="fl green" d="M760 118 V186" marker-end="url(#fg)"/>
<path class="fl green" d="M820 222 H886" marker-end="url(#fg)"/>

<g class="step"><circle cx="193" cy="208" r="10" fill="#475569"/><text x="193" y="212">1</text></g>
<g class="step"><circle cx="270" cy="152" r="10" fill="#475569"/><text x="270" y="156">2</text></g>
<g class="step"><circle cx="413" cy="208" r="10" fill="#059669"/><text x="413" y="212">3</text></g>
<g class="step"><circle cx="633" cy="208" r="10" fill="#475569"/><text x="633" y="212">4</text></g>
<g class="step"><circle cx="710" cy="152" r="10" fill="#475569"/><text x="710" y="156">5</text></g>
<g class="step"><circle cx="853" cy="208" r="10" fill="#059669"/><text x="853" y="212">6</text></g>
<text class="sl" x="338" y="148">token exchange</text>
<text class="sl" x="778" y="148">own token</text>

<!-- blocked passthrough -->
<path class="fl red dash" d="M745 254 V284 H950 V258" marker-end="url(#fr)"/>
<g class="step"><circle cx="848" cy="284" r="10" fill="#dc2626"/><text x="848" y="288">✕</text></g>
<text class="sl r" x="848" y="306" text-anchor="middle">agent's token never forwarded</text>

<!-- token cards -->
<g transform="translate(30,340)">
  <rect class="tok" width="300" height="150" rx="10"/>
  <text class="tk-h" x="16" y="26">Token A · step 1 · user sign-in</text>
  <text class="tk" x="16" y="52">sub   alice</text>
  <text class="tk" x="16" y="72">aud   agent-app</text>
  <text class="tk" x="16" y="92">exp   60 min</text>
  <text class="t2" x="16" y="124">Proves who the user is.</text>
  <text class="t2" x="16" y="140">Never sent to tools.</text>
</g>
<g transform="translate(370,340)">
  <rect class="tok good" width="300" height="150" rx="10"/>
  <text class="tk-h" x="16" y="26">Token B · steps 2–3 · agent for user</text>
  <text class="tk" x="16" y="52">sub   alice</text>
  <text class="tk" x="16" y="72">act   agent-finance-01</text>
  <text class="tk" x="16" y="92">aud   mcp-finance</text>
  <text class="tk" x="16" y="112">roles FinancialWrite · exp 10 min</text>
  <text class="tk" x="16" y="132">cnf   bound to agent key (DPoP)</text>
</g>
<g transform="translate(710,340)">
  <rect class="tok good" width="300" height="150" rx="10"/>
  <text class="tk-h" x="16" y="26">Token C · steps 5–6 · server to API</text>
  <text class="tk" x="16" y="52">sub   alice (on behalf of)</text>
  <text class="tk" x="16" y="72">azp   mcp-finance</text>
  <text class="tk" x="16" y="92">aud   erp-api</text>
  <text class="tk" x="16" y="112">scope journal.post · exp 5 min</text>
  <text class="t2" x="16" y="140">Issued to the server for this API only.</text>
</g>
<path class="fl grey dash" d="M95 254 V336" marker-end="url(#fk)"/>
<path class="fl grey dash" d="M413 236 V336" marker-end="url(#fk)"/>
<path class="fl grey dash" d="M950 254 V336" marker-end="url(#fk)"/>
<text class="lg" x="30" y="530">Claim values are illustrative. Gateway and MCP server reject any token whose audience is not their own.</text>
</svg>
